<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0e18">
<title>Homelab Monitor</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Homelab Monitor</h1>
  <div class="header-right">
    <!-- Live/connection indicator shown in the top bar; green when a poll
         succeeds, red on failure. aria-live so screen readers announce the
         change without the user having to poll the pill themselves. -->
    <span id="status" class="status" aria-live="polite">connecting…</span>
  </div>
</header>

<div id="error-banner" class="error-banner" hidden>
  <span class="error-banner-text"></span>
  <button id="retry-btn" type="button">Retry now</button>
</div>

<main class="views">
  <section id="view-overview" class="view">
    <div id="pull-indicator" class="pull-indicator" hidden></div>
    <!-- Each agent renders as a card below; populated by app.js. -->
    <div id="fleet" class="fleet"></div>
    <button id="add-agent-fab" class="fab" type="button" aria-label="Add server">+</button>
  </section>

  <section id="view-alerts" class="view" hidden>
    <div class="view-header">
      <h2>Alerts</h2>
    </div>
    <p id="alerts-empty" class="empty-state" hidden>
      <span>No active alerts</span>
      <span class="muted">Everything's within threshold.</span>
    </p>
    <ul id="alerts-list" class="alerts-list"></ul>
  </section>

  <section id="view-settings" class="view" hidden>
    <div class="view-header">
      <h2>Settings</h2>
    </div>
    <div class="settings-row">
      <label for="theme-select">Theme</label>
      <select id="theme-select">
        <option value="system">System</option>
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>
    </div>
    <div class="settings-row">
      <button id="logout" class="logout-btn">Log out</button>
    </div>
  </section>
</main>

<nav class="bottom-nav">
  <button class="nav-btn active" data-view="overview" aria-current="page">
    <span class="nav-icon" aria-hidden="true">●</span>
    <span>Overview</span>
  </button>
  <button class="nav-btn" data-view="alerts" aria-current="false">
    <span class="nav-icon" aria-hidden="true">⚠</span>
    <span>Alerts</span>
    <span id="nav-alert-badge" class="nav-badge" hidden>0</span>
  </button>
  <button class="nav-btn" data-view="settings" aria-current="false">
    <span class="nav-icon" aria-hidden="true">⚙</span>
    <span>Settings</span>
  </button>
</nav>

<div id="agent-modal" class="modal-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="agent-modal-title">
    <h3 id="agent-modal-title">Add server</h3>
    <label class="modal-field">
      Address
      <input id="agent-address-input" type="text" placeholder="192.168.1.50:8080" autocomplete="off">
    </label>
    <label class="modal-field">
      Tag <span class="muted">(optional)</span>
      <input id="agent-tag-input" type="text" placeholder="e.g. Plex server" autocomplete="off" maxlength="60">
    </label>
    <p id="agent-modal-error" class="error-text" hidden></p>
    <div class="modal-actions">
      <button id="agent-remove-btn" class="danger-btn" type="button" hidden>Remove server</button>
      <div class="modal-actions-right">
        <button id="agent-cancel-btn" class="modal-cancel-btn" type="button">Cancel</button>
        <button id="agent-save-btn" class="modal-save-btn" type="button">Save</button>
      </div>
    </div>
  </div>
</div>

<script>
  // Register the service worker for offline/installable support. No-op on
  // browsers without SW support; only takes effect over HTTPS or localhost.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/sw.js").catch(function (err) {
        console.debug("Service worker registration failed:", err);
      });
    });
  }
</script>
<script src="app.js"></script>
</body>
</html>
