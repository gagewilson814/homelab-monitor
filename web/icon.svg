<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#0a0e18"/>
  <!-- Monitor frame -->
  <rect x="88" y="112" width="336" height="192" rx="24" fill="none" stroke="#3b82f6" stroke-width="32"/>
  <!-- Three ascending bars (the metric cards), fully contained within the frame -->
  <rect x="148" y="232" width="32" height="40" rx="8" fill="#3b82f6"/>
  <rect x="240" y="196" width="32" height="76" rx="8" fill="#3b82f6"/>
  <rect x="332" y="160" width="32" height="112" rx="8" fill="#3b82f6"/>
  <!-- Stand, clearly separated below the frame -->
  <rect x="236" y="328" width="40" height="32" fill="#3b82f6"/>
  <rect x="180" y="372" width="152" height="28" rx="14" fill="#3b82f6"/>
</svg>
